name: Build iOS

# Only the iOS package. Triggered by hand or on its own tag, so a run never
# waits on the macOS pool alongside seven other platforms.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or branch to build"
        required: true
        default: custom
  push:
    tags:
      - "ios-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  ZSIGN_VERSION: "0.7"

jobs:
  build-ios:
    permissions:
      contents: write
    # macos-26 is the pool GitHub is shortest on; jobs sat queued and were
    # cancelled with "not acquired by Runner of type hosted". ci.yml has been
    # building iOS on macos-15 all along, so use that image here.
    # Try the Intel pool: the arm64 pool has been out of capacity for hours.
    runs-on: macos-13
    env:
      # Rust 1.100 makes the Xcode linker crash on the release build
      # (Segmentation fault: 11); 1.99.1 links. Cargokit builds with this one
      # too. Move up once a newer Rust or Xcode links again.
      CARGOKIT_TOOLCHAIN: "1.99.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          architecture: x64

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CARGOKIT_TOOLCHAIN }}
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust
          cache-on-failure: true

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup signing environment
        env:
          P12_BASE64: ${{ secrets.P12_CERTIFICATE }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          # No certificate configured: the build stays unsigned, which is what
          # a fork without an Apple identity can produce.
          if [ -n "$P12_BASE64" ] && [ -n "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "$P12_BASE64" | base64 -d > certificate.p12
            echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > profile.mobileprovision
            curl -L -o zsign.zip "https://github.com/zhlynn/zsign/releases/download/v${{ env.ZSIGN_VERSION }}/zsign-v${{ env.ZSIGN_VERSION }}-macos-x64.zip"
            unzip zsign.zip
            chmod +x zsign || chmod +x zsign-*
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning title=Unsigned iOS build::P12_CERTIFICATE/PROVISIONING_PROFILE are empty; producing an unsigned .ipa."
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Build iOS
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          if [ "$SIGNED" = "1" ]; then
            ./zsign -f -k ./certificate.p12 -p "$P12_PASSWORD" -m ./profile.mobileprovision ./build/ios/iphoneos/Payload/Runner.app
          fi
          cd build/ios/iphoneos
          # Name the file for what it is: an unsigned package the user signs
          # with their own certificate before installing.
          if [ "$SIGNED" = "1" ]; then
            zip -r "Mangayomi-${{ inputs.tag || github.ref_name }}-ios.ipa" Payload
          else
            zip -r "Mangayomi-${{ inputs.tag || github.ref_name }}-ios-unsigned.ipa" Payload
          fi

      - name: Upload artifact iOS IPA
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Mangayomi-ios-${{ inputs.tag || github.ref_name }}
          path: "build/ios/iphoneos/Mangayomi-*.ipa"
          if-no-files-found: error
